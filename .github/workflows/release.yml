name: Release

# Manual-trigger release workflow.
#
# What it does:
#   1. Resolves a version (input or auto-computed next YY.MM.NN for current month)
#   2. Runs `php -l` on every PHP file we ship
#   3. Bumps Version: header + KW_SECURITY_VERSION constant in kw-security.php
#   4. Commits the bump back to main (with [skip ci] so this doesn't loop)
#   5. Builds kw-security.zip with root folder "kw-security" (required by PUC)
#   6. Reads the hand-written "What's new" / "Why it matters" sections out of
#      the CHANGELOG.md entry (falls back to the technical text if absent)
#   7. Tags + creates a GitHub Release whose body is those two sections with the
#      technical detail (Changed + New) collapsed underneath, with
#      kw-security.zip attached
#   8. Announces the release in Slack
#
# CHANGELOG.md is the source of release notes and is REQUIRED: the extract step
# runs before anything is pushed/tagged/published, so a missing section fails the
# release early rather than shipping an unexplained one. See CHANGELOG.md for the
# expected format.
#
# Trigger: Actions tab → Release → "Run workflow"
#   - version (optional): override the auto-computed YY.MM.NN
#   - dry_run (optional): compute + build + lint, but don't push/tag/release
#   - skip_changelog_check (optional): release without a CHANGELOG.md section
#     (falls back to --generate-notes). Emergencies only.
#   - skip_announcement (optional): release without posting to Slack. The
#     release notes are still written and the release still publishes; only the
#     channel post is suppressed.
#   - slack_webhook_override (optional): post the announcement elsewhere for this
#     run. Also enables the announcement during a dry run, which is how the
#     message gets tested without publishing.
#
# Configuration (optional, not required for a release to succeed):
#   secrets.RELEASE_SLACK_WEBHOOK_URL  - where announcements go
#
# There is no AI in this workflow. "What's new" and "Why it matters" are written
# by hand in CHANGELOG.md, so what the channel reads is exactly what somebody
# wrote and reviewed.
#
# Branch protection note: this workflow pushes directly to main. If main has
# protection requiring PR review, the github-actions[bot] needs a bypass rule,
# or replace the push step with a PR-and-auto-merge dance.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (YY.MM.NN). Leave blank to auto-compute next NN for current month."
        required: false
        default: ""
      dry_run:
        description: "Dry run (lint + build only, no push/tag/release)"
        required: false
        type: boolean
        default: false
      skip_changelog_check:
        description: "Release without a CHANGELOG.md section (emergencies only)"
        required: false
        type: boolean
        default: false
      skip_announcement:
        description: "Don't post to Slack (for small fixes that don't need a channel update)"
        required: false
        type: boolean
        default: false
      slack_webhook_override:
        description: "Slack webhook for this run only (also announces during a dry run)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # Need a token that can push back. Default GITHUB_TOKEN is fine
          # unless branch protection blocks the bot.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: PHP syntax check
        run: |
          php --version
          for f in kw-security.php classes/*.php; do
            php -l "$f"
          done

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            echo "Using supplied version: $VERSION"
          else
            YEAR=$(date -u +%y)
            MONTH=$(date -u +%m)
            PREFIX="${YEAR}.${MONTH}."
            LATEST_NN=$(git tag --list "${PREFIX}*" --sort=-version:refname | head -n1 | sed "s/^${PREFIX}//")
            if [ -z "$LATEST_NN" ]; then
              NN="01"
            else
              # 10# forces base-10 (avoids "08" being treated as octal)
              NN=$(printf "%02d" $((10#$LATEST_NN + 1)))
            fi
            VERSION="${PREFIX}${NN}"
            echo "Auto-computed version: $VERSION"
          fi

          # Validate format
          if ! echo "$VERSION" | grep -qE "^[0-9]{2}\.[0-9]{2}\.[0-9]{2}$"; then
            echo "::error::Invalid version format: $VERSION (expected YY.MM.NN, e.g. 26.06.01)"
            exit 1
          fi

          # Refuse to overwrite an existing tag
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists. Refusing to overwrite."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Runs BEFORE the bump/tag/release steps on purpose: a missing or empty
      # CHANGELOG.md section fails the release here, while nothing has been
      # pushed, tagged, or published yet.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          V: ${{ steps.version.outputs.version }}
          SKIP: ${{ github.event.inputs.skip_changelog_check }}
        run: |
          set -euo pipefail

          # Previous tag, for the compare link. The new tag does not exist yet,
          # so the newest existing tag is the right baseline.
          PREV_TAG=$(git tag --list --sort=-version:refname | head -n1 || true)
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git rev-list --count "${PREV_TAG}..HEAD")
          else
            COMMITS=$(git rev-list --count HEAD)
          fi
          echo "commits=${COMMITS}" >> "$GITHUB_OUTPUT"

          # Sections for versions newer than the newest tag were written for a
          # release that never happened — an abandoned attempt, or a dry run
          # somebody wrote notes for first. They are invisible: the workflow only
          # ever publishes the one section matching the version being released,
          # so that work reaches no release body and no channel. Warn loudly
          # rather than fail: the release being run is still valid.
          STALE=$(grep -oE '^## [0-9]{2}\.[0-9]{2}\.[0-9]{2}$' CHANGELOG.md 2>/dev/null | awk '{print $2}' | while read -r ver; do
            [ "$ver" = "$V" ] && continue
            [ -z "${PREV_TAG:-}" ] && continue
            [ "$ver" = "$PREV_TAG" ] && continue
            # Newer than the newest tag => never released.
            if [ "$(printf '%s\n%s\n' "$ver" "$PREV_TAG" | sort -V | tail -n1)" = "$ver" ]; then
              echo "$ver"
            fi
          done | paste -sd', ' -)

          if [ -n "$STALE" ]; then
            echo "::warning::CHANGELOG.md has sections for ${STALE}, newer than the latest tag (${PREV_TAG}) and not the version being released (${V}). Nothing in those sections will reach a release body or Slack. Fold them into the ${V} section, or release those versions first."
          fi

          CHANGELOG="$RUNNER_TEMP/changelog.md"

          # Pull the block between "## <version>" and the next "## " heading.
          # $V is passed as an awk variable rather than interpolated into the
          # script, and has already been validated as YY.MM.NN above.
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$V" '
              $0 == "## " ver { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > "$CHANGELOG"
          else
            : > "$CHANGELOG"
          fi

          # Trim leading/trailing blank lines.
          sed -i -e '/./,$!d' "$CHANGELOG"
          printf '%s\n' "$(cat "$CHANGELOG")" > "$CHANGELOG"

          # A section that is only headings (no bullets) counts as empty — an
          # entry with a "### Changed" and nothing under it explains nothing.
          BODY=$(grep -vE '^\s*(#|$)' "$CHANGELOG" || true)

          if [ -z "$BODY" ]; then
            if [ "$SKIP" = "true" ]; then
              echo "::warning::No usable CHANGELOG.md section for ${V}; falling back to auto-generated notes (skip_changelog_check was set)."
              echo "have_notes=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::CHANGELOG.md has no usable '## ${V}' section. Add one (see the format at the top of CHANGELOG.md) and re-run, or set skip_changelog_check to release without it."
            exit 1
          fi

          echo "have_notes=true" >> "$GITHUB_OUTPUT"

          # The two plain-language sections, written by hand in CHANGELOG.md.
          #
          # They live in the changelog rather than a workflow input on purpose:
          # workflow_dispatch inputs are single-line text boxes — GitHub has no
          # multiline input type — so bullets and paragraphs cannot survive one.
          # In the changelog they are written in a normal editor, reviewed in the
          # pull request alongside the code, and kept in version control.
          #
          # Pulls the lines under a "### <heading>" up to the next "### ".
          trim_file() {
            sed -i -e '/./,$!d' "$1"
            printf '%s\n' "$(cat "$1")" > "$1"
          }

          extract_subsection() {
            awk -v pat="$1" '
              /^###[[:space:]]+/ { inside = (tolower($0) ~ pat); next }
              inside { print }
            ' "$CHANGELOG" > "$2"
            trim_file "$2"
          }

          extract_subsection '^###[[:space:]]+what' "$RUNNER_TEMP/what.md"
          extract_subsection '^###[[:space:]]+why'  "$RUNNER_TEMP/why.md"

          # Real content, not file size: trim_file rewrites an empty file as a
          # single newline, so -s would call it non-empty and Slack would be
          # handed an empty block, which it rejects outright.
          has_content() { grep -q '[^[:space:]]' "$1" 2>/dev/null; }

          if has_content "$RUNNER_TEMP/what.md" && has_content "$RUNNER_TEMP/why.md"; then
            echo "have_summary=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The ${V} changelog section is missing a What's new or Why it matters subsection. The announcement falls back to the technical notes."
            echo "have_summary=false" >> "$GITHUB_OUTPUT"
          fi

          # Technical-only cut: "### Changed" and "### New". What's new and Why
          # it matters are dropped because they are rendered above this block,
          # and "### Problem" because Why it matters now says the same thing in
          # the voice this block's readers are not here for.
          TECHNICAL="$RUNNER_TEMP/changelog-technical.md"
          awk '
            /^###[[:space:]]+/ { drop = (tolower($0) ~ /^###[[:space:]]+(problem|what|why)/) }
            !drop { print }
          ' "$CHANGELOG" > "$TECHNICAL"
          trim_file "$TECHNICAL"

          # An entry with no Changed or New leaves nothing technical behind.
          # Better the full section than an empty collapsed block.
          if [ -z "$(grep -vE '^\s*(#|$)' "$TECHNICAL" || true)" ]; then
            echo "::notice::The ${V} changelog section has no Changed or New content; the technical detail block keeps the full section."
            cp "$CHANGELOG" "$TECHNICAL"
          fi

          echo "Full changelog section for ${V}:"
          cat "$CHANGELOG"

          echo "Technical detail block for ${V}:"
          cat "$TECHNICAL"

      # Release body: plain language first, technical detail collapsed underneath,
      # so one page serves both a client-facing reader and a developer. The
      # WordPress plugin reads this body back to show "what's new" in its own
      # update alert, cutting it at the <details> marker.
      - name: Compose release notes
        id: body
        env:
          V:            ${{ steps.version.outputs.version }}
          PREV_TAG:     ${{ steps.notes.outputs.prev_tag }}
          COMMITS:      ${{ steps.notes.outputs.commits }}
          HAVE_NOTES:   ${{ steps.notes.outputs.have_notes }}
          HAVE_SUMMARY: ${{ steps.notes.outputs.have_summary }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/notes.md"
          : > "$NOTES"

          if [ "${HAVE_SUMMARY:-false}" = "true" ]; then
            {
              echo "## What's new"
              echo
              cat "$RUNNER_TEMP/what.md"
              echo
              echo "## Why it matters"
              echo
              cat "$RUNNER_TEMP/why.md"
              echo
            } >> "$NOTES"
          fi

          if [ "${HAVE_NOTES:-false}" = "true" ]; then
            {
              if [ "${HAVE_SUMMARY:-false}" = "true" ]; then
                # Changed + New only. Problem is deliberately left out: "Why it
                # matters" above already covers it, in the voice this block's
                # readers are not here for.
                echo "<details>"
                echo "<summary>Technical detail</summary>"
                echo
                cat "$RUNNER_TEMP/changelog-technical.md"
                echo
                echo "</details>"
              else
                # No summary, so the changelog is the whole release note. Keep
                # Problem here — with nothing above it, it is the only thing
                # explaining why the release exists.
                cat "$RUNNER_TEMP/changelog.md"
              fi
              echo
            } >> "$NOTES"
          fi

          {
            echo "---"
            if [ -n "${PREV_TAG:-}" ]; then
              echo "[Full commit log since ${PREV_TAG}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${V}) · ${COMMITS} commits"
              echo
            fi
            echo "Sites running KW Security see this update on their next check (~12h), or immediately via \`/wp-admin/plugins.php?force-check=1\`."
          } >> "$NOTES"

          echo "Release body:"
          cat "$NOTES"

      - name: Bump version in kw-security.php
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          sed -i -E "s#^  Version: .*#  Version: ${V}#" kw-security.php
          sed -i -E "s#define\('KW_SECURITY_VERSION', '[^']+'\)#define('KW_SECURITY_VERSION', '${V}')#" kw-security.php

          echo "Version lines after bump:"
          grep -nE "Version:|KW_SECURITY_VERSION" kw-security.php

          # Sanity check — both lines must now contain the new version
          if ! grep -q "Version: ${V}" kw-security.php; then
            echo "::error::Failed to bump 'Version:' header"
            exit 1
          fi
          if ! grep -q "KW_SECURITY_VERSION', '${V}'" kw-security.php; then
            echo "::error::Failed to bump KW_SECURITY_VERSION constant"
            exit 1
          fi

      - name: Build kw-security.zip
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          STAGE="$RUNNER_TEMP/stage"
          mkdir -p "$STAGE/kw-security"

          # Mirror the working tree into a folder named exactly "kw-security"
          # so PUC drops it into wp-content/plugins/kw-security/ on update.
          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".gitignore" \
            --exclude=".gitattributes" \
            --exclude=".editorconfig" \
            --exclude=".DS_Store" \
            --exclude="node_modules" \
            --exclude="*.zip" \
            --exclude="deploy" \
            ./ "$STAGE/kw-security/"

          cd "$STAGE"
          zip -rq "$GITHUB_WORKSPACE/kw-security.zip" kw-security
          echo "Built:"
          ls -lh "$GITHUB_WORKSPACE/kw-security.zip"
          echo "Top-level contents:"
          unzip -l "$GITHUB_WORKSPACE/kw-security.zip" | head -20

      - name: Generate info.json (update server metadata)
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # PUC's self-hosted mode reads this document instead of the GitHub
          # Releases API. It is generated here, from the same inputs as the
          # release body, so the notes a site is shown and the version it is
          # offered can never drift apart.
          python3 - <<'PY'
          import json, os, re, pathlib, datetime, hashlib

          v   = os.environ['V']
          src = pathlib.Path('kw-security.php').read_text(encoding='utf-8', errors='replace')

          def header(name, default=''):
              m = re.search(r'^\s*%s:\s*(.+)$' % re.escape(name), src, re.M)
              return m.group(1).strip() if m else default

          tmp   = pathlib.Path(os.environ['RUNNER_TEMP'])
          notes = ''
          if (tmp / 'notes.md').exists():
              notes = (tmp / 'notes.md').read_text(encoding='utf-8')

          # Minimal markdown -> HTML for the "View details" modal. Deliberately
          # not a general converter: the only input is our own release notes,
          # whose shape is fixed by CHANGELOG.md. It works on blank-line
          # separated blocks so a paragraph wrapped across several source lines
          # stays one <p>, and so a list becomes one <ul>.
          def inline(t):
              t = re.sub(r'\[([^\]]+)\]\(([^)]+)\)', r'<a href="\2">\1</a>', t)
              t = re.sub(r'`([^`]+)`', r'<code>\1</code>', t)
              t = re.sub(r'\*\*([^*]+)\*\*', r'<strong>\1</strong>', t)
              return t

          def to_html(md):
              out, para, items = [], [], []

              def flush_para():
                  if para:
                      # Join first: a paragraph wrapped across several source
                      # lines is one paragraph, not one <p> per line.
                      out.append('<p>%s</p>' % inline(' '.join(para)))
                      para.clear()

              def flush_list():
                  if items:
                      out.append('<ul>%s</ul>'
                                 % ''.join('<li>%s</li>' % i for i in items))
                      items.clear()

              def flush():
                  flush_list()
                  flush_para()

              for raw in md.strip().splitlines():
                  line = raw.strip()

                  if line == '':
                      flush()
                  elif line.startswith('<'):
                      # The notes embed real HTML (<details>, <summary>) on
                      # purpose. Wrapping those in <p> produces broken markup.
                      flush()
                      out.append(line)
                  elif re.match(r'^(-{3,}|\*{3,}|_{3,})$', line):
                      # Checked before the list rule: '---' is a rule, '- x'
                      # is an item, and only the latter has trailing space.
                      flush()
                      out.append('<hr>')
                  else:
                      h = re.match(r'^(#{1,6})\s+(.*)$', line)
                      li = re.match(r'^[-*]\s+(.*)$', line)
                      if h:
                          flush()
                          lvl = min(len(h.group(1)) + 2, 6)
                          out.append('<h%d>%s</h%d>'
                                     % (lvl, inline(h.group(2).strip()), lvl))
                      elif li:
                          flush_para()
                          items.append(inline(li.group(1)))
                      elif items and raw[:1] in (' ', '\t'):
                          # An indented line directly under a bullet is that
                          # bullet wrapping, not a new paragraph. Without this
                          # a wrapped bullet split into a <li> plus an orphan
                          # <p>, mid-sentence, in the "View details" modal.
                          items[-1] += ' ' + inline(line)
                      else:
                          flush_list()
                          para.append(line)

              flush()
              return '\n'.join(out)

          zip_path = pathlib.Path('kw-security.zip')
          sha256   = hashlib.sha256(zip_path.read_bytes()).hexdigest()

          # Single source of truth: the endpoint the shipped plugin actually
          # polls. Hard-coding it here too would let the two drift, and the
          # failure would be silent — sites would keep polling the old URL
          # while releases landed on the new one.
          m = re.search(r"define\(\s*'KW_UPDATE_SERVER'\s*,\s*'([^']+)'\s*\)", src)
          if not m:
              raise SystemExit('KW_UPDATE_SERVER not found in kw-security.php')
          base = m.group(1).rstrip('/')

          info = {
              'name':            'KW Security',
              'slug':            'kw-security',
              'version':         v,
              'download_url':    base + '/kw-security.zip',
              'homepage':        header('Plugin URI', 'https://kilowott.com/'),
              'requires':        header('Requires at least', '5.0'),
              'tested':          header('Tested up to', ''),
              'author':          '<a href="https://kilowott.com/">KW Development</a>',
              'author_homepage': 'https://kilowott.com/',
              'last_updated':    datetime.datetime.now(datetime.timezone.utc)
                                     .strftime('%Y-%m-%d %H:%M:%S'),
              # Raw markdown, read by KW_Security_Alerts::fetch_own_release_notes()
              # for the Slack update alert. Same text the GitHub release body has.
              'release_notes':   notes,
              # Integrity reference. Nothing verifies this yet; it is recorded so
              # a tampered artifact can be detected after the fact.
              'zip_sha256':      sha256,
              'sections': {
                  'changelog': to_html(notes),
              },
          }

          pathlib.Path('info.json').write_text(
              json.dumps(info, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print('info.json for %s (zip sha256 %s)' % (v, sha256[:16]))

          # Hand the endpoint to later steps rather than repeating the literal.
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write('UPDATE_BASE_URL=%s\n' % base)
          PY

          echo "--- info.json ---"
          cat info.json
          python3 -c "import json;json.load(open('info.json'));print('valid JSON')"

      - name: Upload zip as workflow artifact (for dry-run inspection)
        uses: actions/upload-artifact@v4
        with:
          name: kw-security-${{ steps.version.outputs.version }}
          path: |
            kw-security.zip
            info.json
          retention-days: 14

      - name: Note that the announcement was skipped
        if: ${{ github.event.inputs.skip_announcement == 'true' }}
        run: |
          echo "::notice::skip_announcement was set, so nothing was posted to Slack. The release and its notes are unaffected."

      - name: Dry run summary
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "::notice::Dry run complete. Version: ${{ steps.version.outputs.version }}"
          echo "::notice::Zip is available as the workflow artifact above. No commit, tag, or release created."

      # NOTE: every publish step below is gated on dry_run != 'true'.
      # Without these guards, `exit 0` in a single step would NOT halt the
      # whole job — subsequent steps would still run and an unintended
      # release would be published. (See the 26.06.01 incident.)

      - name: Commit version bump back to main
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kw-security.php
          # If the file is already at the target version (e.g. a maintainer
          # pre-bumped it in a regular PR), the sed step above was a no-op
          # and there is nothing to commit. That's a valid state — skip the
          # commit/push and let the tag + release steps run.
          if git diff --cached --quiet; then
            echo "::notice::kw-security.php already at version ${V}; skipping bump commit."
          else
            # [skip ci] prevents this commit from re-triggering push-based workflows
            git commit -m "chore: bump version to ${V} [skip ci]"
            git push origin main
          fi

      # This is the step that actually ships. Everything above it produces
      # artifacts and records; until these files land on the update server, no
      # site in the field can see the release.
      #
      # It runs BEFORE the tag and GitHub Release so that a failure here leaves
      # nothing tagged and nothing published, and the whole workflow can simply
      # be re-run at the same version. That matters because "Resolve version"
      # refuses to reuse an existing tag: with the tag already pushed, a failed
      # deploy could not be retried at that version at all, and would have to be
      # fixed by hand or by burning a version number.
      #
      # The version bump commit above is already safe to re-run — it skips the
      # commit when kw-security.php is at the target version.
      #
      # The residual risk is inverted: a tag or release failure after a
      # successful deploy leaves sites able to download a version with no tag.
      # That is both far less likely than an SSH or firewall failure here, and
      # trivially repaired by tagging by hand.
      - name: Deploy to update server
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST:    ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER:    ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH:    ${{ secrets.DEPLOY_PATH }}
          V:              ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          KEY="$RUNNER_TEMP/deploy_key"
          KNOWN="$RUNNER_TEMP/known_hosts"
          # Remove the private key even if a later command fails.
          trap 'rm -f "$KEY"' EXIT

          printf '%s\n' "$DEPLOY_SSH_KEY" > "$KEY"
          chmod 600 "$KEY"

          # Host key is PINNED, not discovered with ssh-keyscan. Fetching it at
          # deploy time would trust whatever answers on port 22, which defeats
          # the point on the one channel that pushes executable code to every
          # client site. If the VPS is rebuilt, this line must be updated and
          # the new key verified out of band — a failure here is the control
          # working, not a bug to route around.
          echo '65.254.80.95 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKrWk3SSpsM8frBVq+tAwkQ3iUZXTQx3ffNCdgS31cHv' > "$KNOWN"

          SSHOPTS="-i $KEY -o UserKnownHostsFile=$KNOWN -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20"
          REMOTE="$DEPLOY_USER@$DEPLOY_HOST"

          # Upload order is load-bearing. info.json is what advertises the new
          # version, so it goes LAST — publishing it first would point sites at
          # a download that is still the previous release, or absent entirely.
          # Each file lands under a temporary name and is then moved into place,
          # so a site polling mid-deploy never sees a half-written file.

          echo "Uploading artifact..."
          scp $SSHOPTS kw-security.zip "$REMOTE:$DEPLOY_PATH/.kw-security.zip.new"

          # .htaccess goes via a temporary name like the other two. scp
          # truncates the destination and then streams into it, and Apache
          # re-reads .htaccess on every request, so writing straight over the
          # live path means a failed transfer can leave a partial file serving
          # traffic. Truncated in the wrong place it drops "Require all denied"
          # while the directory still serves — which is the exact hole that let
          # dropped PHP execute here before.
          echo "Uploading server config..."
          scp $SSHOPTS deploy/kw-security.htaccess "$REMOTE:$DEPLOY_PATH/.htaccess.new"

          echo "Promoting artifact, then metadata..."
          scp $SSHOPTS info.json "$REMOTE:$DEPLOY_PATH/.info.json.new"
          ssh $SSHOPTS "$REMOTE" "
            set -e
            cd '$DEPLOY_PATH'
            mv .htaccess.new .htaccess
            mv .kw-security.zip.new kw-security.zip
            mv .info.json.new info.json
            chmod 644 kw-security.zip info.json .htaccess
            ls -la
          "

          echo "::notice::Deployed $V to the update server."

      - name: Verify the published endpoint
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BASE="$UPDATE_BASE_URL"   # exported by the info.json step

          # A release that published but did not actually become reachable is
          # the failure mode worth catching here: sites would keep polling and
          # silently stay on the old version. Assert the endpoint really is
          # serving what we just built, rather than trusting the upload.

          echo "Fetching info.json..."
          curl -fsS --max-time 30 "$BASE/info.json" -o served.json
          SERVED=$(python3 -c "import json;print(json.load(open('served.json'))['version'])")
          if [ "$SERVED" != "$V" ]; then
            echo "::error::Endpoint serves version '$SERVED' but this release is '$V'."
            exit 1
          fi
          echo "info.json reports $SERVED"

          echo "Downloading artifact..."
          curl -fsS --max-time 120 "$BASE/kw-security.zip" -o served.zip
          EXPECT=$(python3 -c "import json;print(json.load(open('served.json'))['zip_sha256'])")
          ACTUAL=$(sha256sum served.zip | cut -d" " -f1)
          if [ "$EXPECT" != "$ACTUAL" ]; then
            echo "::error::Served zip does not match the checksum in info.json."
            echo "  expected $EXPECT"
            echo "  actual   $ACTUAL"
            exit 1
          fi
          echo "artifact checksum matches"

          # The zip must unpack to a folder named exactly "kw-security" or WP
          # installs the update into the wrong directory and the site ends up
          # with two copies of the plugin.
          if ! unzip -l served.zip | grep -qE " kw-security/"; then
            echo "::error::Served zip does not have a kw-security/ root folder."
            exit 1
          fi

          # The hardening rules must be live. Without them the directory is
          # browsable and dropped PHP executes.
          for path in "" ".htaccess"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$BASE/$path")
            if [ "$CODE" != "403" ]; then
              echo "::error::Expected 403 for '$BASE/$path', got $CODE. Check .htaccess."
              exit 1
            fi
          done
          echo "endpoint hardening verified"

          echo "::notice::Endpoint verified: $BASE serving $V."

      - name: Create and push tag
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          git tag "$V"
          git push origin "$V"

      - name: Create GitHub Release with zip asset
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          # Body was assembled by the "Compose release notes" step: plain-language
          # WHAT/WHY on top, technical detail collapsed underneath. The plugin
          # reads this back to show "what's new" in its own update alert.
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            gh release create "$V" \
              --title "$V" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              "kw-security.zip"
          else
            gh release create "$V" \
              --title "$V" \
              --generate-notes \
              "kw-security.zip"
          fi
          echo "::notice::Release $V published. PUC-enabled sites will see the update on their next poll (~12h)."

      # Announcement is best-effort: continue-on-error means a Slack outage or a
      # misconfigured webhook never fails an otherwise-successful release. It
      # also runs during a dry run when slack_webhook_override is set, which is
      # how the message gets tested without publishing anything.
      # Announcement is best-effort: continue-on-error means a Slack outage or a
      # misconfigured webhook never fails an otherwise-successful release. It
      # also runs during a dry run when slack_webhook_override is set, which is
      # how the message gets previewed without publishing anything.
      - name: Announce release in Slack
        # Parens are load-bearing: && binds tighter than || in GitHub
        # expressions, so without them this would read as
        # skip_announcement != true && dry_run != true, OR override != ''
        # — and an override would post even when the announcement was skipped.
        if: ${{ github.event.inputs.skip_announcement != 'true' && (github.event.inputs.dry_run != 'true' || github.event.inputs.slack_webhook_override != '') }}
        continue-on-error: true
        env:
          # Resolution order mirrors the plugin's own webhook chain (constant →
          # env → option): one-off input, then secret, then non-secret variable.
          WEBHOOK_OVERRIDE: ${{ github.event.inputs.slack_webhook_override }}
          WEBHOOK_SECRET:   ${{ secrets.RELEASE_SLACK_WEBHOOK_URL }}
          WEBHOOK_VAR:      ${{ vars.RELEASE_SLACK_WEBHOOK_URL }}
          V:                ${{ steps.version.outputs.version }}
          PREV_TAG:         ${{ steps.notes.outputs.prev_tag }}
          COMMITS:          ${{ steps.notes.outputs.commits }}
          HAVE_NOTES:       ${{ steps.notes.outputs.have_notes }}
          HAVE_SUMMARY:     ${{ steps.notes.outputs.have_summary }}
          IS_DRY_RUN:       ${{ github.event.inputs.dry_run }}
        run: |
          set -uo pipefail

          WEBHOOK="${WEBHOOK_OVERRIDE:-${WEBHOOK_SECRET:-${WEBHOOK_VAR:-}}}"
          if [ -z "$WEBHOOK" ]; then
            echo "::notice::No Slack webhook configured (RELEASE_SLACK_WEBHOOK_URL secret or variable). Skipping the announcement."
            exit 0
          fi

          # Only ever post to Slack. Guards against a mistyped secret or a
          # tampered variable redirecting release notes to another host.
          case "$WEBHOOK" in
            https://hooks.slack.com/*) ;;
            *)
              echo "::warning::Configured webhook is not an https://hooks.slack.com/ URL. Refusing to post."
              exit 0
              ;;
          esac

          RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${V}"
          if [ -n "${PREV_TAG:-}" ]; then
            COMPARE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${V}"
          else
            COMPARE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commits"
          fi

          # Slack mrkdwn is not markdown: no "#" headings, "-" bullets render as
          # literal dashes, bold is one asterisk not two, and links use a
          # different syntax. Translate the constructs a release note actually
          # uses; anything else is left as written.
          #   "### Foo"     -> "*Foo*"
          #   "**bold**"    -> "*bold*"     (before the bullet rule)
          #   "- item"      -> "• item"
          #   "[text](url)" -> "<url|text>"
          #
          # The unwrap pass comes first: source text is often hard-wrapped at ~80
          # columns, and Slack treats those newlines as hard breaks, which splits
          # sentences mid-clause. Joining continuation lines back together lets
          # Slack do its own wrapping.
          to_mrkdwn() {
            awk '
              function flush() { if (buf != "") { print buf; buf = "" } }
              /^[[:space:]]*$/                  { flush(); print ""; next }
              /^[[:space:]]*[-*+][[:space:]]/   { flush(); buf = $0; next }
              /^[[:space:]]*#/                  { flush(); print; next }
              /^[[:space:]]+[^[:space:]]/       { if (buf != "") { sub(/^[[:space:]]+/, "", $0); buf = buf " " $0; next } }
                                                { flush(); buf = $0 }
              END { flush() }
            ' "$1" | sed -E \
              -e 's/\*\*([^*]+)\*\*/*\1*/g' \
              -e 's/^#{1,6}[[:space:]]+(.*)$/*\1*/' \
              -e 's/^([[:space:]]*)[-*+][[:space:]]+/\1• /' \
              -e 's/\[([^]]+)\]\(([^)]+)\)/<\2|\1>/g'
          }

          # Slack caps a section block at 3000 chars; cut well short of it.
          LIMIT=2600
          truncate_body() {
            if [ "${#1}" -gt "$LIMIT" ]; then
              printf '%s\n…\n_Truncated — <%s|read the full notes on GitHub>._' "${1:0:$LIMIT}" "$RELEASE_URL"
            else
              printf '%s' "$1"
            fi
          }

          WHAT=""
          WHY=""
          FALLBACK=""
          if [ "${HAVE_SUMMARY:-false}" = "true" ]; then
            WHAT=$(to_mrkdwn "$RUNNER_TEMP/what.md")
            WHY=$(to_mrkdwn "$RUNNER_TEMP/why.md")
          elif [ "${HAVE_NOTES:-false}" = "true" ] && [ -f "$RUNNER_TEMP/changelog.md" ]; then
            # The changelog entry has no What's new / Why it matters, so the
            # technical text is all there is. Say so, rather than letting it read
            # as the intended format.
            FALLBACK=$(to_mrkdwn "$RUNNER_TEMP/changelog.md")
          fi

          HEADER=":rocket: KW Security ${V}"
          if [ "$IS_DRY_RUN" = "true" ]; then
            HEADER=":test_tube: DRY RUN — KW Security ${V}"
          fi

          # Notify everyone in the channel. <!channel> only resolves inside an
          # mrkdwn section — a header block is plain_text, so a mention written
          # there renders as the literal string "<!channel>". It also goes in the
          # top-level text, which is what Slack shows in the notification itself.
          CHANNEL_TAG="<!channel>"

          FOOTER="<${RELEASE_URL}|View release>  ·  <${COMPARE_URL}|${COMMITS} changes since ${PREV_TAG:-the beginning}>"

          # Built with jq --arg so release prose cannot break the JSON body.
          # A header block (plain_text) keeps the title from running into the
          # body, and What / Why are separate section blocks so each gets its own
          # 3000-char budget.
          if [ -n "$WHAT" ]; then
            PAYLOAD=$(jq -n \
              --arg header "$HEADER" \
              --arg what "$(truncate_body "$WHAT")" \
              --arg why "$(truncate_body "$WHY")" \
              --arg footer "$FOOTER" \
              --arg tag "$CHANNEL_TAG" \
              '{
                text: ($tag + " " + $header),
                blocks: [
                  { type: "header", text: { type: "plain_text", text: $header, emoji: true } },
                  { type: "section", text: { type: "mrkdwn", text: $tag } },
                  { type: "divider" },
                  { type: "section", text: { type: "mrkdwn", text: ("*What'"'"'s new*\n" + $what) } },
                  { type: "section", text: { type: "mrkdwn", text: ("*Why it matters*\n" + $why) } },
                  { type: "context", elements: [ { type: "mrkdwn", text: $footer } ] }
                ]
              }')
          else
            if [ -z "$FALLBACK" ]; then
              FALLBACK="_No release notes were available for this version._"
            else
              FALLBACK=$(printf '_This release has no hand-written summary, so the technical notes follow._\n\n%s' "$FALLBACK")
            fi
            PAYLOAD=$(jq -n \
              --arg header "$HEADER" \
              --arg body "$(truncate_body "$FALLBACK")" \
              --arg footer "$FOOTER" \
              --arg tag "$CHANNEL_TAG" \
              '{
                text: ($tag + " " + $header),
                blocks: [
                  { type: "header", text: { type: "plain_text", text: $header, emoji: true } },
                  { type: "section", text: { type: "mrkdwn", text: $tag } },
                  { type: "divider" },
                  { type: "section", text: { type: "mrkdwn", text: $body } },
                  { type: "context", elements: [ { type: "mrkdwn", text: $footer } ] }
                ]
              }')
          fi

          HTTP_CODE=$(curl -sS -o /tmp/slack-response.txt -w '%{http_code}' \
            --max-time 15 \
            -X POST \
            -H 'Content-Type: application/json' \
            --data-binary "$PAYLOAD" \
            "$WEBHOOK") || {
              echo "::warning::Slack announcement failed to send (curl error). The release itself is unaffected."
              exit 0
            }

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "::notice::Slack announcement posted for ${V}."
          else
            echo "::warning::Slack rejected the announcement (HTTP ${HTTP_CODE}): $(cat /tmp/slack-response.txt). The release itself is unaffected."
          fi
