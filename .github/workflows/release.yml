name: Release

# Manual-trigger release workflow.
#
# What it does:
#   1. Resolves a version (input or auto-computed next YY.MM.NN for current month)
#   2. Runs `php -l` on every PHP file we ship
#   3. Bumps Version: header + KW_SECURITY_VERSION constant in kw-security.php
#   4. Commits the bump back to main (with [skip ci] so this doesn't loop)
#   5. Builds kw-security.zip with root folder "kw-security" (required by PUC)
#   6. Rewrites the technical changelog into a plain-language WHAT / WHY via the
#      Gemini API (best-effort; falls back to the changelog text)
#   7. Tags + creates a GitHub Release whose body is WHAT / WHY with the technical
#      detail collapsed underneath, with kw-security.zip attached
#   8. Announces the release in Slack
#
# CHANGELOG.md is the source of release notes and is REQUIRED: the extract step
# runs before anything is pushed/tagged/published, so a missing section fails the
# release early rather than shipping an unexplained one. See CHANGELOG.md for the
# expected format.
#
# Trigger: Actions tab → Release → "Run workflow"
#   - version (optional): override the auto-computed YY.MM.NN
#   - dry_run (optional): compute + build + lint, but don't push/tag/release
#   - skip_changelog_check (optional): release without a CHANGELOG.md section
#     (falls back to --generate-notes). Emergencies only.
#   - release_context (optional): a paragraph of business context for this
#     release. The main input the summary cannot derive from the code itself.
#   - slack_webhook_override (optional): post the announcement elsewhere for this
#     run. Also enables the announcement during a dry run, which is how the
#     message gets tested without publishing.
#
# Configuration (all optional, none required for a release to succeed):
#   secrets.RELEASE_SLACK_WEBHOOK_URL  - where announcements go
#   secrets.GEMINI_API_KEY             - enables the plain-language summary
#   vars.GEMINI_MODEL                  - defaults to gemini-3.7-flash
#   vars.GEMINI_API_URL                - defaults to the v1beta models endpoint
# The summary prompt lives in .github/release-summary-prompt.md so it can be
# tuned without touching this workflow.
#
# Branch protection note: this workflow pushes directly to main. If main has
# protection requiring PR review, the github-actions[bot] needs a bypass rule,
# or replace the push step with a PR-and-auto-merge dance.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (YY.MM.NN). Leave blank to auto-compute next NN for current month."
        required: false
        default: ""
      dry_run:
        description: "Dry run (lint + build only, no push/tag/release)"
        required: false
        type: boolean
        default: false
      release_context:
        description: "Business context for this release, in a paragraph (feeds the plain-language WHAT/WHY)"
        required: false
        default: ""
      skip_changelog_check:
        description: "Release without a CHANGELOG.md section (emergencies only)"
        required: false
        type: boolean
        default: false
      slack_webhook_override:
        description: "Slack webhook for this run only (also announces during a dry run)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # Need a token that can push back. Default GITHUB_TOKEN is fine
          # unless branch protection blocks the bot.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: PHP syntax check
        run: |
          php --version
          for f in kw-security.php classes/*.php; do
            php -l "$f"
          done

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            echo "Using supplied version: $VERSION"
          else
            YEAR=$(date -u +%y)
            MONTH=$(date -u +%m)
            PREFIX="${YEAR}.${MONTH}."
            LATEST_NN=$(git tag --list "${PREFIX}*" --sort=-version:refname | head -n1 | sed "s/^${PREFIX}//")
            if [ -z "$LATEST_NN" ]; then
              NN="01"
            else
              # 10# forces base-10 (avoids "08" being treated as octal)
              NN=$(printf "%02d" $((10#$LATEST_NN + 1)))
            fi
            VERSION="${PREFIX}${NN}"
            echo "Auto-computed version: $VERSION"
          fi

          # Validate format
          if ! echo "$VERSION" | grep -qE "^[0-9]{2}\.[0-9]{2}\.[0-9]{2}$"; then
            echo "::error::Invalid version format: $VERSION (expected YY.MM.NN, e.g. 26.06.01)"
            exit 1
          fi

          # Refuse to overwrite an existing tag
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists. Refusing to overwrite."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Runs BEFORE the bump/tag/release steps on purpose: a missing or empty
      # CHANGELOG.md section fails the release here, while nothing has been
      # pushed, tagged, or published yet.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          V: ${{ steps.version.outputs.version }}
          SKIP: ${{ github.event.inputs.skip_changelog_check }}
        run: |
          set -euo pipefail

          # Previous tag, for the compare link. The new tag does not exist yet,
          # so the newest existing tag is the right baseline.
          PREV_TAG=$(git tag --list --sort=-version:refname | head -n1 || true)
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git rev-list --count "${PREV_TAG}..HEAD")
          else
            COMMITS=$(git rev-list --count HEAD)
          fi
          echo "commits=${COMMITS}" >> "$GITHUB_OUTPUT"

          CHANGELOG="$RUNNER_TEMP/changelog.md"

          # Pull the block between "## <version>" and the next "## " heading.
          # $V is passed as an awk variable rather than interpolated into the
          # script, and has already been validated as YY.MM.NN above.
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$V" '
              $0 == "## " ver { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > "$CHANGELOG"
          else
            : > "$CHANGELOG"
          fi

          # Trim leading/trailing blank lines.
          sed -i -e '/./,$!d' "$CHANGELOG"
          printf '%s\n' "$(cat "$CHANGELOG")" > "$CHANGELOG"

          # A section that is only headings (no bullets) counts as empty — an
          # entry with a "### Changed" and nothing under it explains nothing.
          BODY=$(grep -vE '^\s*(#|$)' "$CHANGELOG" || true)

          if [ -z "$BODY" ]; then
            if [ "$SKIP" = "true" ]; then
              echo "::warning::No usable CHANGELOG.md section for ${V}; falling back to auto-generated notes (skip_changelog_check was set)."
              echo "have_notes=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::CHANGELOG.md has no usable '## ${V}' section. Add one (see the format at the top of CHANGELOG.md) and re-run, or set skip_changelog_check to release without it."
            exit 1
          fi

          echo "have_notes=true" >> "$GITHUB_OUTPUT"

          echo "Technical changelog section for ${V}:"
          cat "$CHANGELOG"

      # Turns the technical changelog into the WHAT / WHY the channel actually
      # reads. Best-effort by design: continue-on-error plus an explicit
      # have_summary output, so a missing key, a rate limit, or a reply that
      # drifts from the contract degrades to the hand-written changelog rather
      # than blocking a release.
      #
      # Deliberately NOT using the structured-output / responseSchema surface:
      # its docs describe a different request shape than the generateContent
      # reference, so instead the model is asked for two delimited markdown
      # sections which are parsed with awk. That works on either API generation.
      # Model and endpoint come from Actions variables, so a Google API change is
      # a config change rather than a code change.
      - name: Summarize release for a non-technical audience
        id: summary
        continue-on-error: true
        env:
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:    ${{ vars.GEMINI_MODEL }}
          GEMINI_API_URL:  ${{ vars.GEMINI_API_URL }}
          V:               ${{ steps.version.outputs.version }}
          PREV_TAG:        ${{ steps.notes.outputs.prev_tag }}
          RELEASE_CONTEXT: ${{ github.event.inputs.release_context }}
          PROMPT_FILE:     .github/release-summary-prompt.md
        run: |
          set -uo pipefail

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::notice::No GEMINI_API_KEY secret set. Skipping the plain-language summary; the announcement falls back to the changelog text."
            echo "have_summary=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ ! -s "$PROMPT_FILE" ]; then
            echo "::warning::${PROMPT_FILE} is missing or empty. Falling back to the changelog text."
            echo "have_summary=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MODEL="${GEMINI_MODEL:-gemini-3.7-flash}"
          API_BASE="${GEMINI_API_URL:-https://generativelanguage.googleapis.com/v1beta/models}"

          # Commit subjects since the last tag, minus the workflow's own version
          # bump commits, which say nothing about the release.
          if [ -n "${PREV_TAG:-}" ]; then
            COMMIT_LOG=$(git log --pretty=%s "${PREV_TAG}..HEAD" | grep -vE '^chore: bump version' || true)
          else
            COMMIT_LOG=$(git log --pretty=%s | grep -vE '^chore: bump version' || true)
          fi

          CHANGELOG_TEXT=$(cat "$RUNNER_TEMP/changelog.md" 2>/dev/null || true)

          USER_PROMPT=$(printf 'Version being released: %s\n\n=== Context from the person running the release ===\n%s\n\n=== Technical changelog for this version ===\n%s\n\n=== Change subjects since the previous release ===\n%s\n' \
            "$V" \
            "${RELEASE_CONTEXT:-(none supplied)}" \
            "${CHANGELOG_TEXT:-(none)}" \
            "${COMMIT_LOG:-(none)}")

          # jq --arg encodes both prompts as JSON data. The changelog and the
          # context paragraph are free text and would otherwise break the body.
          REQUEST=$(jq -n \
            --rawfile sys "$PROMPT_FILE" \
            --arg user "$USER_PROMPT" \
            '{
              systemInstruction: { parts: [ { text: $sys } ] },
              contents: [ { role: "user", parts: [ { text: $user } ] } ],
              generationConfig: { temperature: 0.3, maxOutputTokens: 2048 }
            }')

          HTTP_CODE=$(curl -sS -o "$RUNNER_TEMP/gemini.json" -w '%{http_code}' \
            --max-time 90 \
            -X POST \
            -H 'Content-Type: application/json' \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            --data-binary "$REQUEST" \
            "${API_BASE}/${MODEL}:generateContent") || {
              echo "::warning::Could not reach the Gemini API. Falling back to the changelog text."
              echo "have_summary=false" >> "$GITHUB_OUTPUT"
              exit 0
            }

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            # Surface only the message: an error body can echo request content.
            REASON=$(jq -r '.error.message // "no message"' "$RUNNER_TEMP/gemini.json" 2>/dev/null || echo "unparseable response")
            echo "::warning::Gemini returned HTTP ${HTTP_CODE} (${REASON}). Falling back to the changelog text."
            echo "have_summary=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TEXT=$(jq -r '[.candidates[0].content.parts[]?.text] | join("")' "$RUNNER_TEMP/gemini.json" 2>/dev/null)
          if [ -z "$TEXT" ] || [ "$TEXT" = "null" ]; then
            FINISH=$(jq -r '.candidates[0].finishReason // "unknown"' "$RUNNER_TEMP/gemini.json" 2>/dev/null || echo unknown)
            echo "::warning::Gemini returned no usable text (finish reason: ${FINISH}). Falling back to the changelog text."
            echo "have_summary=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "$TEXT" > "$RUNNER_TEMP/summary-raw.md"

          # Split on the two agreed headings, so a reply that drifts from the
          # contract fails here instead of posting half a message.
          awk 'tolower($0) ~ /^#{1,6}[[:space:]]*what/ { s="what"; next }
               tolower($0) ~ /^#{1,6}[[:space:]]*why/  { s="why";  next }
               s == "what" { print }' "$RUNNER_TEMP/summary-raw.md" > "$RUNNER_TEMP/what.md"
          awk 'tolower($0) ~ /^#{1,6}[[:space:]]*why/  { s="why";  next }
               s == "why" { print }' "$RUNNER_TEMP/summary-raw.md" > "$RUNNER_TEMP/why.md"

          for f in "$RUNNER_TEMP/what.md" "$RUNNER_TEMP/why.md"; do
            sed -i -e '/./,$!d' "$f"
            printf '%s\n' "$(cat "$f")" > "$f"
          done

          # Test for real content, not file size: the trim above rewrites an
          # empty file as a single newline, so -s would call it non-empty and a
          # reply missing one section would post an empty block (which Slack
          # rejects outright).
          has_content() { grep -q '[^[:space:]]' "$1" 2>/dev/null; }

          if ! has_content "$RUNNER_TEMP/what.md" || ! has_content "$RUNNER_TEMP/why.md"; then
            echo "::warning::The reply did not contain both a What and a Why section. Falling back to the changelog text."
            {
              echo "## Discarded summary for ${V}"
              echo "The reply did not follow the two-section contract, so the changelog text was used instead."
              echo '```'
              cat "$RUNNER_TEMP/summary-raw.md"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "have_summary=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "have_summary=true" >> "$GITHUB_OUTPUT"

          # Logged so every release keeps a record of exactly what was generated,
          # reviewable on the run even though it posts without an approval step.
          {
            echo "## Plain-language summary for ${V}"
            echo "_Generated by ${MODEL}. This is what was posted to Slack and used as the release body._"
            echo
            echo "### What"
            cat "$RUNNER_TEMP/what.md"
            echo
            echo "### Why"
            cat "$RUNNER_TEMP/why.md"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Generated summary:"
          cat "$RUNNER_TEMP/what.md" "$RUNNER_TEMP/why.md"

      # Release body: plain language first, technical detail collapsed underneath,
      # so one page serves both a client-facing reader and a developer. The
      # WordPress plugin reads this body back to show "what's new" in its own
      # update alert, cutting it at the <details> marker.
      - name: Compose release notes
        id: body
        env:
          V:            ${{ steps.version.outputs.version }}
          PREV_TAG:     ${{ steps.notes.outputs.prev_tag }}
          COMMITS:      ${{ steps.notes.outputs.commits }}
          HAVE_NOTES:   ${{ steps.notes.outputs.have_notes }}
          HAVE_SUMMARY: ${{ steps.summary.outputs.have_summary }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/notes.md"
          : > "$NOTES"

          if [ "${HAVE_SUMMARY:-false}" = "true" ]; then
            {
              echo "## What's new"
              echo
              cat "$RUNNER_TEMP/what.md"
              echo
              echo "## Why it matters"
              echo
              cat "$RUNNER_TEMP/why.md"
              echo
            } >> "$NOTES"
          fi

          if [ "${HAVE_NOTES:-false}" = "true" ]; then
            {
              if [ "${HAVE_SUMMARY:-false}" = "true" ]; then
                echo "<details>"
                echo "<summary>Technical detail</summary>"
                echo
                cat "$RUNNER_TEMP/changelog.md"
                echo
                echo "</details>"
              else
                cat "$RUNNER_TEMP/changelog.md"
              fi
              echo
            } >> "$NOTES"
          fi

          {
            echo "---"
            if [ -n "${PREV_TAG:-}" ]; then
              echo "[Full commit log since ${PREV_TAG}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${V}) · ${COMMITS} commits"
              echo
            fi
            echo "Sites running KW Security see this update on their next check (~12h), or immediately via \`/wp-admin/plugins.php?force-check=1\`."
          } >> "$NOTES"

          echo "Release body:"
          cat "$NOTES"

      - name: Bump version in kw-security.php
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          sed -i -E "s#^  Version: .*#  Version: ${V}#" kw-security.php
          sed -i -E "s#define\('KW_SECURITY_VERSION', '[^']+'\)#define('KW_SECURITY_VERSION', '${V}')#" kw-security.php

          echo "Version lines after bump:"
          grep -nE "Version:|KW_SECURITY_VERSION" kw-security.php

          # Sanity check — both lines must now contain the new version
          if ! grep -q "Version: ${V}" kw-security.php; then
            echo "::error::Failed to bump 'Version:' header"
            exit 1
          fi
          if ! grep -q "KW_SECURITY_VERSION', '${V}'" kw-security.php; then
            echo "::error::Failed to bump KW_SECURITY_VERSION constant"
            exit 1
          fi

      - name: Build kw-security.zip
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          STAGE="$RUNNER_TEMP/stage"
          mkdir -p "$STAGE/kw-security"

          # Mirror the working tree into a folder named exactly "kw-security"
          # so PUC drops it into wp-content/plugins/kw-security/ on update.
          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".gitignore" \
            --exclude=".gitattributes" \
            --exclude=".editorconfig" \
            --exclude=".DS_Store" \
            --exclude="node_modules" \
            --exclude="*.zip" \
            ./ "$STAGE/kw-security/"

          cd "$STAGE"
          zip -rq "$GITHUB_WORKSPACE/kw-security.zip" kw-security
          echo "Built:"
          ls -lh "$GITHUB_WORKSPACE/kw-security.zip"
          echo "Top-level contents:"
          unzip -l "$GITHUB_WORKSPACE/kw-security.zip" | head -20

      - name: Upload zip as workflow artifact (for dry-run inspection)
        uses: actions/upload-artifact@v4
        with:
          name: kw-security-${{ steps.version.outputs.version }}
          path: kw-security.zip
          retention-days: 14

      - name: Dry run summary
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "::notice::Dry run complete. Version: ${{ steps.version.outputs.version }}"
          echo "::notice::Zip is available as the workflow artifact above. No commit, tag, or release created."

      # NOTE: every publish step below is gated on dry_run != 'true'.
      # Without these guards, `exit 0` in a single step would NOT halt the
      # whole job — subsequent steps would still run and an unintended
      # release would be published. (See the 26.06.01 incident.)

      - name: Commit version bump back to main
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kw-security.php
          # If the file is already at the target version (e.g. a maintainer
          # pre-bumped it in a regular PR), the sed step above was a no-op
          # and there is nothing to commit. That's a valid state — skip the
          # commit/push and let the tag + release steps run.
          if git diff --cached --quiet; then
            echo "::notice::kw-security.php already at version ${V}; skipping bump commit."
          else
            # [skip ci] prevents this commit from re-triggering push-based workflows
            git commit -m "chore: bump version to ${V} [skip ci]"
            git push origin main
          fi

      - name: Create and push tag
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          git tag "$V"
          git push origin "$V"

      - name: Create GitHub Release with zip asset
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          # Body was assembled by the "Compose release notes" step: plain-language
          # WHAT/WHY on top, technical detail collapsed underneath. The plugin
          # reads this back to show "what's new" in its own update alert.
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            gh release create "$V" \
              --title "$V" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              "kw-security.zip"
          else
            gh release create "$V" \
              --title "$V" \
              --generate-notes \
              "kw-security.zip"
          fi
          echo "::notice::Release $V published. PUC-enabled sites will see the update on their next poll (~12h)."

      # Announcement is best-effort: continue-on-error means a Slack outage or a
      # misconfigured webhook never fails an otherwise-successful release. It
      # also runs during a dry run when slack_webhook_override is set, which is
      # how the message gets tested without publishing anything.
      # Announcement is best-effort: continue-on-error means a Slack outage or a
      # misconfigured webhook never fails an otherwise-successful release. It
      # also runs during a dry run when slack_webhook_override is set, which is
      # how the message gets previewed without publishing anything.
      - name: Announce release in Slack
        if: ${{ github.event.inputs.dry_run != 'true' || github.event.inputs.slack_webhook_override != '' }}
        continue-on-error: true
        env:
          # Resolution order mirrors the plugin's own webhook chain (constant →
          # env → option): one-off input, then secret, then non-secret variable.
          WEBHOOK_OVERRIDE: ${{ github.event.inputs.slack_webhook_override }}
          WEBHOOK_SECRET:   ${{ secrets.RELEASE_SLACK_WEBHOOK_URL }}
          WEBHOOK_VAR:      ${{ vars.RELEASE_SLACK_WEBHOOK_URL }}
          V:                ${{ steps.version.outputs.version }}
          PREV_TAG:         ${{ steps.notes.outputs.prev_tag }}
          COMMITS:          ${{ steps.notes.outputs.commits }}
          HAVE_NOTES:       ${{ steps.notes.outputs.have_notes }}
          HAVE_SUMMARY:     ${{ steps.summary.outputs.have_summary }}
          IS_DRY_RUN:       ${{ github.event.inputs.dry_run }}
        run: |
          set -uo pipefail

          WEBHOOK="${WEBHOOK_OVERRIDE:-${WEBHOOK_SECRET:-${WEBHOOK_VAR:-}}}"
          if [ -z "$WEBHOOK" ]; then
            echo "::notice::No Slack webhook configured (RELEASE_SLACK_WEBHOOK_URL secret or variable). Skipping the announcement."
            exit 0
          fi

          # Only ever post to Slack. Guards against a mistyped secret or a
          # tampered variable redirecting release notes to another host.
          case "$WEBHOOK" in
            https://hooks.slack.com/*) ;;
            *)
              echo "::warning::Configured webhook is not an https://hooks.slack.com/ URL. Refusing to post."
              exit 0
              ;;
          esac

          RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${V}"
          if [ -n "${PREV_TAG:-}" ]; then
            COMPARE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${V}"
          else
            COMPARE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commits"
          fi

          # Slack mrkdwn is not markdown: no "#" headings, "-" bullets render as
          # literal dashes, bold is one asterisk not two, and links use a
          # different syntax. Translate the constructs a release note actually
          # uses; anything else is left as written.
          #   "### Foo"     -> "*Foo*"
          #   "**bold**"    -> "*bold*"     (before the bullet rule)
          #   "- item"      -> "• item"
          #   "[text](url)" -> "<url|text>"
          #
          # The unwrap pass comes first: source text is often hard-wrapped at ~80
          # columns, and Slack treats those newlines as hard breaks, which splits
          # sentences mid-clause. Joining continuation lines back together lets
          # Slack do its own wrapping.
          to_mrkdwn() {
            awk '
              function flush() { if (buf != "") { print buf; buf = "" } }
              /^[[:space:]]*$/                  { flush(); print ""; next }
              /^[[:space:]]*[-*+][[:space:]]/   { flush(); buf = $0; next }
              /^[[:space:]]*#/                  { flush(); print; next }
              /^[[:space:]]+[^[:space:]]/       { if (buf != "") { sub(/^[[:space:]]+/, "", $0); buf = buf " " $0; next } }
                                                { flush(); buf = $0 }
              END { flush() }
            ' "$1" | sed -E \
              -e 's/\*\*([^*]+)\*\*/*\1*/g' \
              -e 's/^#{1,6}[[:space:]]+(.*)$/*\1*/' \
              -e 's/^([[:space:]]*)[-*+][[:space:]]+/\1• /' \
              -e 's/\[([^]]+)\]\(([^)]+)\)/<\2|\1>/g'
          }

          # Slack caps a section block at 3000 chars; cut well short of it.
          LIMIT=2600
          truncate_body() {
            if [ "${#1}" -gt "$LIMIT" ]; then
              printf '%s\n…\n_Truncated — <%s|read the full notes on GitHub>._' "${1:0:$LIMIT}" "$RELEASE_URL"
            else
              printf '%s' "$1"
            fi
          }

          WHAT=""
          WHY=""
          FALLBACK=""
          if [ "${HAVE_SUMMARY:-false}" = "true" ]; then
            WHAT=$(to_mrkdwn "$RUNNER_TEMP/what.md")
            WHY=$(to_mrkdwn "$RUNNER_TEMP/why.md")
          elif [ "${HAVE_NOTES:-false}" = "true" ] && [ -f "$RUNNER_TEMP/changelog.md" ]; then
            # No plain-language summary available, so the technical changelog is
            # all there is. Say so, rather than letting it read as the intended
            # format.
            FALLBACK=$(to_mrkdwn "$RUNNER_TEMP/changelog.md")
          fi

          HEADER=":rocket: KW Security ${V}"
          if [ "$IS_DRY_RUN" = "true" ]; then
            HEADER=":test_tube: DRY RUN — KW Security ${V}"
          fi

          FOOTER="<${RELEASE_URL}|View release>  ·  <${COMPARE_URL}|${COMMITS} changes since ${PREV_TAG:-the beginning}>"

          # Built with jq --arg so release prose cannot break the JSON body.
          # A header block (plain_text) keeps the title from running into the
          # body, and What / Why are separate section blocks so each gets its own
          # 3000-char budget.
          if [ -n "$WHAT" ]; then
            PAYLOAD=$(jq -n \
              --arg header "$HEADER" \
              --arg what "$(truncate_body "$WHAT")" \
              --arg why "$(truncate_body "$WHY")" \
              --arg footer "$FOOTER" \
              '{
                text: $header,
                blocks: [
                  { type: "header", text: { type: "plain_text", text: $header, emoji: true } },
                  { type: "divider" },
                  { type: "section", text: { type: "mrkdwn", text: ("*What'"'"'s new*\n" + $what) } },
                  { type: "section", text: { type: "mrkdwn", text: ("*Why it matters*\n" + $why) } },
                  { type: "context", elements: [ { type: "mrkdwn", text: $footer } ] }
                ]
              }')
          else
            if [ -z "$FALLBACK" ]; then
              FALLBACK="_No release notes were available for this version._"
            else
              FALLBACK=$(printf '_A plain-language summary was not available for this release, so the technical notes follow._\n\n%s' "$FALLBACK")
            fi
            PAYLOAD=$(jq -n \
              --arg header "$HEADER" \
              --arg body "$(truncate_body "$FALLBACK")" \
              --arg footer "$FOOTER" \
              '{
                text: $header,
                blocks: [
                  { type: "header", text: { type: "plain_text", text: $header, emoji: true } },
                  { type: "divider" },
                  { type: "section", text: { type: "mrkdwn", text: $body } },
                  { type: "context", elements: [ { type: "mrkdwn", text: $footer } ] }
                ]
              }')
          fi

          HTTP_CODE=$(curl -sS -o /tmp/slack-response.txt -w '%{http_code}' \
            --max-time 15 \
            -X POST \
            -H 'Content-Type: application/json' \
            --data-binary "$PAYLOAD" \
            "$WEBHOOK") || {
              echo "::warning::Slack announcement failed to send (curl error). The release itself is unaffected."
              exit 0
            }

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "::notice::Slack announcement posted for ${V}."
          else
            echo "::warning::Slack rejected the announcement (HTTP ${HTTP_CODE}): $(cat /tmp/slack-response.txt). The release itself is unaffected."
          fi
